<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B4BFF"/>
      <stop offset="1" stop-color="#FF4F8B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE3EE"/>
    </linearGradient>
  </defs>
  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the loop: an open ring with an arrow head -->
  <path d="M 362 188 A 128 128 0 1 0 384 256" fill="none" stroke="url(#ring)" stroke-width="46" stroke-linecap="round"/>
  <!-- three club "dots" sitting on the loop -->
  <circle cx="256" cy="128" r="26" fill="#FFD84D" stroke="#5B4BFF" stroke-width="8"/>
  <circle cx="145" cy="320" r="26" fill="#4DE3C1" stroke="#5B4BFF" stroke-width="8"/>
  <circle cx="331" cy="360" r="26" fill="#FFFFFF" stroke="#FF4F8B" stroke-width="8"/>
  <!-- centre U -->
  <path d="M 216 222 L 216 270 A 40 40 0 0 0 296 270 L 296 222" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
</svg>
