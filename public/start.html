<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniLoop · Start screen v3</title>
<style>
/* ============================================================
   UniLoop 初始界面 v3
   改动：深色图片 Hero（缓慢淡入淡出）+ 悬浮搜索胶囊 + 4 个紧凑筛选
        去掉日期行 / 去掉 Try 行 / 去掉自动滚动 marquee（改为滑动吸附）
        SVG 图标替换 emoji / When 支持选具体某一天
   ============================================================ */
:root{
  --paper:#F4F1E7; --surface:#FFFDF8; --ink:#14201B; --ink2:#3A4A42; --muted:#74817A;
  --line:#E4DFD2; --line2:#D6D0C0; --forest:#1F4A3B; --coral:#D8583A; --coral-soft:#FBEDE8;
  --sage:#E9EFE8; --dark:#0E1A15;
  --r-card:16px; --r-btn:12px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(20,32,27,.05); --sh-2:0 14px 34px -20px rgba(20,32,27,.35);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);
  background:radial-gradient(900px 520px at 50% -8%,#FFFDF6 0%,#EFEBDF 60%,#E7E2D4 100%);
  display:flex;align-items:center;justify-content:center;padding:24px}
/* 颗粒质感（很淡） */
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;z-index:99;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.6'/></svg>")}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2F6B52;outline-offset:2px}

.app{width:390px;height:844px;background:var(--paper);border-radius:40px;overflow:hidden;position:relative;
  box-shadow:0 40px 90px -40px rgba(20,32,27,.55),0 0 0 1px rgba(20,32,27,.06);display:flex;flex-direction:column}
@media (max-width:720px){body{padding:0;background:var(--paper)}.app{width:100%;height:100dvh;border-radius:0;box-shadow:none}}

/* ================= HERO（深色图片 + 缓慢切换） ================= */
.hero{position:relative;flex:none;height:352px;overflow:hidden;background:var(--dark)}
@media (max-width:720px){.hero{height:44vh;min-height:300px}}
.slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;
  transform:scale(1.04);animation:slideFade 32s infinite;will-change:opacity,transform}
.slide:nth-child(1){animation-delay:0s}
.slide:nth-child(2){animation-delay:8s}
.slide:nth-child(3){animation-delay:16s}
.slide:nth-child(4){animation-delay:24s}
@keyframes slideFade{
  0%{opacity:0;transform:scale(1.04)}
  3%{opacity:1}
  22%{opacity:1;transform:scale(1.10)}
  25%{opacity:0;transform:scale(1.11)}
  100%{opacity:0;transform:scale(1.04)}
}
@media (prefers-reduced-motion:reduce){
  .slide{animation:none;opacity:0;transform:none}
  .slide:nth-child(1){opacity:1}
}
/* 深色渐隐，底部融进纸底色 */
.veil{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(10,18,14,.72) 0%,rgba(10,18,14,.42) 38%,rgba(10,18,14,.18) 58%,rgba(244,241,231,.06) 76%,var(--paper) 100%),
    radial-gradient(120% 80% at 20% 0%,rgba(10,18,14,.55),transparent 60%)}
.hero-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;z-index:3}
.hero-top .brand{display:flex;align-items:center;gap:8px;font-weight:750;font-size:15px;color:#fff;letter-spacing:-.01em}
.hero-top .brand svg{width:22px;height:22px}
.hero-top .city{font-size:11.5px;color:rgba(255,255,255,.66)}
.hero-top .sp{flex:1}
.hero-top .avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
  color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;backdrop-filter:blur(6px)}
.hero-body{position:absolute;left:16px;right:16px;bottom:54px;z-index:3;color:#fff}
.kicker{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:rgba(255,255,255,.72);margin:0 0 8px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.06;letter-spacing:-.02em;margin:0 0 10px;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.hero-meta{margin:0;font-size:12.5px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-meta b{font-weight:650;color:#fff}
.hero-meta .dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.5)}
.hero-dots{position:absolute;right:16px;bottom:60px;display:flex;gap:5px;z-index:3}
.hero-dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);transition:.3s}
.hero-dots i.on{background:#fff;width:14px;border-radius:3px}

/* ================= 悬浮搜索胶囊 ================= */
.searchwrap{margin:-30px 16px 0;position:relative;z-index:5}
.searchbar{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-pill);box-shadow:0 18px 40px -22px rgba(20,32,27,.45),0 2px 6px rgba(20,32,27,.06);
  height:58px;padding:0 6px 0 4px;gap:0}
.seg{flex:1;min-width:0;height:46px;border:0;background:transparent;border-radius:var(--r-pill);
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 12px;text-align:left}
.seg:hover{background:#F5F2E8}
.seg .lbl{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.seg .val{font-size:12.5px;font-weight:650;color:var(--ink);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seg.dim .val{color:var(--muted);font-weight:550}
.searchbar .divider{width:1px;height:26px;background:var(--line);flex:none}
.searchbar .go{width:46px;height:46px;border-radius:50%;border:0;background:var(--coral);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px -6px rgba(216,88,58,.7)}
.searchbar .go svg{width:18px;height:18px}

/* ================= 4 个紧凑筛选（一行放得下，不横滑） ================= */
.filters{display:flex;gap:8px;margin:12px 0 0;padding:0}
.filter{flex:1 1 0;min-width:0;height:44px;padding:0 10px;border-radius:var(--r-pill);
  border:1px solid var(--line);background:var(--surface);color:var(--ink2);
  font-size:12px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filter svg{width:12px;height:12px;opacity:.6;flex:none}
.filter[data-active="true"]{background:var(--forest);border-color:var(--forest);color:#fff}
.filter[data-active="true"] svg{opacity:.9}

/* ================= 内容 ================= */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 104px;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:26px 16px 10px}
.sec h2{font-size:18px;margin:0;letter-spacing:-.01em;font-weight:700}
.sec button{background:none;border:0;color:var(--forest);font-size:12.5px;font-weight:650;min-height:44px;padding:0 0 0 8px;display:inline-flex;align-items:center}
.sec .sub{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:0}

/* 滑动吸附 rail：不自动滚，左右滑，露半张卡提示还有 */
.rail{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  padding:2px 16px 10px;scroll-padding-left:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail .card{scroll-snap-align:start}
.rail-arrows{display:none}

/* 入场动画（轻） */
.reveal{opacity:0;transform:translateY(10px);transition:opacity .5s cubic-bezier(.22,.8,.24,1),transform .5s cubic-bezier(.22,.8,.24,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

/* ================= 卡片（层级：类别 → 标题 → 时间 → 地点 → 价格/余位） ================= */
.card{flex:none;width:164px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  overflow:hidden;box-shadow:var(--sh-1);display:flex;flex-direction:column;text-align:left;padding:0;
  transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.card:active{transform:scale(.985)}
.card .thumb{position:relative;height:104px;background:var(--sage);flex:none;overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.card:hover .thumb img{transform:scale(1.04)}
.card .date{position:absolute;left:8px;top:8px;background:rgba(14,26,21,.78);color:#fff;border-radius:8px;
  padding:3px 6px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;backdrop-filter:blur(4px)}
.card .save{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;border:0;
  background:rgba(255,253,248,.94);display:grid;place-items:center;color:var(--ink2)}
.card .save svg{width:15px;height:15px}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.card .chipcat{position:absolute;left:8px;bottom:8px;background:rgba(255,253,248,.93);color:var(--forest);
  font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:6px;backdrop-filter:blur(4px)}
.card .title{font-size:14px;font-weight:700;line-height:1.26;margin:1px 0 4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.card .meta svg{width:11px;height:11px;opacity:.45;flex:none}
.card .foot{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:6px}
.card .price{font-size:13px;font-weight:750;font-variant-numeric:tabular-nums}
.card .seats{font-size:10.5px;font-weight:700;color:var(--muted)}
.card .seats.low{color:var(--coral);background:var(--coral-soft);padding:2px 6px;border-radius:6px}

/* 校徽行 */
.campuses{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 16px 8px}
.campus{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 4px;
  display:flex;flex-direction:column;align-items:center;gap:6px;height:74px;justify-content:center;transition:.15s}
.campus:hover{border-color:var(--forest)}
.campus img{height:22px;max-width:100%;object-fit:contain}
.campus span{font-size:9.5px;color:var(--muted);font-weight:600}

/* 结果列表 */
.results{padding:18px 16px 0}
.results .head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.results .count{font-size:13px;color:var(--muted)}
.results .clear{background:none;border:0;color:var(--forest);font-weight:650;font-size:13px;padding:10px 0}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:12px;text-align:left;box-shadow:var(--sh-1)}
.row .rhumb{width:84px;height:84px;border-radius:12px;overflow:hidden;flex:none;background:var(--sage)}
.row .rhumb img{width:100%;height:100%;object-fit:cover}
.row .rmain{flex:1;min-width:0}
.row .rtitle{font-size:14.5px;font-weight:700;line-height:1.28;margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .rmeta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rfoot{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.row .rprice{font-size:13px;font-weight:750}
.row .rseats{font-size:10.5px;font-weight:700;color:var(--muted)}
.row .rseats.low{color:var(--coral)}
.row .rtag{font-size:10.5px;color:var(--forest);background:var(--sage);border-radius:6px;padding:2px 6px;font-weight:650}
.empty{padding:48px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}

/* 底部 Tab */
.tabs{position:absolute;left:0;right:0;bottom:0;height:calc(62px + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(255,253,248,.94);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;z-index:10}
.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:center;font-size:10.5px;font-weight:650}
.tab svg{width:21px;height:21px}
.tab[aria-current="page"]{color:var(--forest)}

/* 遮罩与抽屉 */
.scrim{position:absolute;inset:0;background:rgba(10,18,14,.44);opacity:0;pointer-events:none;transition:opacity .22s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--surface);
  border-radius:24px 24px 0 0;box-shadow:0 -20px 50px -20px rgba(10,18,14,.45);
  transform:translateY(102%);transition:transform .28s cubic-bezier(.22,.8,.24,1);
  max-height:90%;display:flex;flex-direction:column;overflow:hidden}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0;flex:none}

/* 分步搜索面板 */
.sheet.search .head{padding:12px 16px 2px;display:flex;align-items:center;gap:10px}
.sheet.search .steps{display:flex;gap:6px;flex:1}
.sheet.search .steps i{height:3px;border-radius:2px;background:var(--line);flex:1;transition:.3s}
.sheet.search .steps i.on{background:var(--forest)}
.sheet.search .close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--ink2)}
.sheet.search h3{font-size:19px;margin:12px 16px 2px}
.sheet.search .sub{margin:0 16px 12px;font-size:12.5px;color:var(--muted)}
.sheet.search .opts{padding:0 16px 8px;overflow-y:auto}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border:1px solid var(--line);
  background:var(--surface);border-radius:12px;margin-bottom:8px;text-align:left;min-height:54px}
.opt .ico{width:34px;height:34px;border-radius:9px;background:var(--sage);display:grid;place-items:center;flex:none;color:var(--forest)}
.opt .crest{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.opt .crest img{width:100%;height:100%;object-fit:contain;padding:5px}
.opt .crest svg{width:17px;height:17px;fill:none;stroke:var(--forest);stroke-width:1.7}
.opt .badge{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;
  font-size:9.5px;font-weight:800;letter-spacing:.02em;flex:none}
.opt .dot{width:10px;height:10px;border-radius:50%;flex:none;margin:0 12px 0 2px}
.opt .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:650;padding-left:8px}
.opt .ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.opt .t{font-size:14px;font-weight:650;display:block}
.opt .d{font-size:11.5px;color:var(--muted);display:block;margin-top:1px}
.opt .tick{margin-left:auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);flex:none;position:relative}
.opt[aria-pressed="true"]{border-color:var(--forest);background:#F4F8F5}
.opt[aria-pressed="true"] .tick{background:var(--forest);border-color:var(--forest)}
.opt[aria-pressed="true"] .tick::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
/* 搜索输入 + 热门词 */
.searchfield{display:flex;align-items:center;gap:8px;margin:0 16px 10px;height:46px;border:1px solid var(--line);
  background:var(--surface);border-radius:12px;padding:0 12px}
.searchfield svg{width:16px;height:16px;color:var(--muted);flex:none}
.searchfield input{border:0;background:transparent;flex:1;font-size:14px;color:var(--ink);min-width:0}
.popular{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 6px}
.popular button{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;
  height:32px;padding:0 10px;font-size:12px;font-weight:600}
.popular .lbl{font-size:11px;color:var(--muted);align-self:center;margin-right:2px}
/* 日期条 */
.datestrip{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
.datestrip::-webkit-scrollbar{display:none}
.dchip{flex:none;width:58px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink2)}
.dchip .dn{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.dchip .dd{font-size:17px;font-weight:750;font-variant-numeric:tabular-nums}
.dchip .ev{font-size:9.5px;color:var(--forest);font-weight:700}
.dchip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:#fff}
.dchip[aria-pressed="true"] .dn,.dchip[aria-pressed="true"] .ev{color:rgba(255,255,255,.8)}
.dchip.none{opacity:.45}
.sheet.search .foot{padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet.search .foot .count{font-size:12.5px;color:var(--muted);flex:1}
.sheet.search .foot .show{height:48px;padding:0 20px;border-radius:14px;border:0;background:var(--forest);color:#fff;font-weight:700;font-size:14px}

/* ================= 活动详情（整页，不是小抽屉） ================= */
.eventpage{position:absolute;inset:0;background:var(--paper);z-index:22;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .30s cubic-bezier(.22,.8,.24,1)}
.eventpage.on{transform:none}
.ep-scroll{flex:1;overflow-y:auto;padding-bottom:104px}
.ep-hero{position:relative;height:300px;background:#DCD7C8;flex:none}
.ep-hero img{width:100%;height:100%;object-fit:cover;display:block}
.ep-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,14,.45) 0%,rgba(10,18,14,.06) 38%,transparent 60%)}
.ep-top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;z-index:3}
.ep-top button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,253,248,.94);
  display:grid;place-items:center;color:var(--ink);box-shadow:0 6px 18px -8px rgba(10,18,14,.5)}
.ep-body{padding:16px}
.ep-cat{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);font-weight:800}
.ep-body h1{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.12;letter-spacing:-.01em;margin:6px 0 12px}
.ep-host{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ep-host img{width:38px;height:38px;object-fit:contain}
.ep-host b{font-size:13.5px;display:block}
.ep-host span{font-size:11.5px;color:var(--muted)}
.ep-meta{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.ep-meta .mrow{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink2);line-height:1.4}
.ep-meta .mrow svg{width:16px;height:16px;flex:none;color:var(--muted);margin-top:1px}
.ep-meta .mrow b{display:block;font-size:13.5px;color:var(--ink)}
.ep-meta .mrow span{font-size:12px;color:var(--muted)}
.ep-desc{font-size:14px;line-height:1.62;color:var(--ink2);margin:6px 0 18px}
.ep-sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:20px 0 10px}
.ep-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.ep-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--forest),#3C7B60)}
.ep-map iframe{width:100%;height:180px;border:0;border-radius:14px;display:block;background:#E7E2D4}
.ep-map .mapbtns{display:flex;gap:8px;margin-top:8px}
.ep-map .mapbtns a{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:650;color:var(--ink);text-decoration:none}
.ep-cta{position:absolute;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:rgba(255,253,248,.96);border-top:1px solid var(--line);backdrop-filter:blur(14px);
  display:flex;align-items:center;gap:12px;z-index:3}
.ep-cta .p{display:flex;flex-direction:column;min-width:88px}
.ep-cta .p b{font-size:17px;font-variant-numeric:tabular-nums}
.ep-cta .p span{font-size:11px;color:var(--muted)}
.ep-cta .p span.low{color:var(--coral);font-weight:700}
.ep-cta .rsvp{flex:1;height:50px;border-radius:14px;border:0;background:var(--forest);color:#fff;font-weight:700;font-size:15px}
.ep-cta .rsvp[disabled]{background:var(--line2);color:#fff}

.sheet.event .pic{height:172px;margin:10px 16px 0;border-radius:16px;overflow:hidden;background:var(--sage);flex:none}
.sheet.event .pic img{width:100%;height:100%;object-fit:cover}
.sheet.event .content{padding:16px 16px 0;overflow-y:auto}
.sheet.event .cat{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.sheet.event h3{font-size:20px;line-height:1.2;margin:4px 0 6px}
.sheet.event .smeta{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.sheet.event .sdesc{font-size:13.5px;line-height:1.55;color:var(--ink2);margin:0 0 14px}
.sheet.event .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sheet.event .fact{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.sheet.event .fact .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sheet.event .fact .v{font-size:13px;font-weight:650;margin-top:2px}
.sheet.event .actions{display:flex;gap:8px;padding:10px 0 16px}
.sheet.event .actions .btn{flex:1;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.sheet.event .actions .btn.primary{background:var(--forest);border-color:var(--forest);color:#fff}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="hero" id="hero">
    <div class="slides" id="slides"></div>
    <div class="veil"></div>
    <header class="hero-top">
      <span class="brand">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.2c3 2.4 4.6 5.6 4.6 8.8S15 18.4 12 20.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4.2 9.2h15.6M4.2 14.8h15.6" stroke="currentColor" stroke-width="1.4" opacity=".55"/></svg>
        UniLoop
      </span>
      <span class="city" id="cityLabel">Sydney</span>
      <span class="sp"></span>
      <button class="avatar" id="avatarBtn" aria-label="Account">JC</button>
    </header>
    <div class="hero-body">
      <p class="kicker" id="heroKicker">Tonight on campus</p>
      <h1 id="heroTitle">Find your kind<br>of evening.</h1>
      <p class="hero-meta" id="heroMeta"></p>
    </div>
    <div class="hero-dots" id="heroDots"><i class="on"></i><i></i><i></i><i></i></div>
  </section>

  <div class="searchwrap">
    <div class="searchbar" role="search">
      <button class="seg dim" id="segWhere" aria-label="Where">
        <span class="lbl">Where</span><span class="val" id="valWhere">Anywhere</span>
      </button>
      <span class="divider"></span>
      <button class="seg dim" id="segWhen" aria-label="When">
        <span class="lbl">When</span><span class="val" id="valWhen">Any day</span>
      </button>
      <span class="divider"></span>
      <button class="seg dim" id="segWhat" aria-label="What">
        <span class="lbl">What</span><span class="val" id="valWhat">Anything</span>
      </button>
      <button class="go" id="searchGo" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="filters" id="filterRow">
      <button class="filter" data-pill="when" data-active="false"><span id="pillWhen">Any day</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="filter" data-pill="what" data-active="false"><span id="pillWhat">Any type</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="filter" data-pill="free" data-active="false">Free</button>
      <button class="filter" data-pill="radius" data-active="false"><span id="pillRadius">3 km</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
  </div>

  <main class="scroll" id="scroll">
    <section id="homeView">
      <div class="sec reveal"><h2>Happening soon</h2><button data-see="soon">See all</button></div>
      <div class="rail" id="railSoon"></div>

      <div class="sec reveal"><h2>Free this week</h2><button data-see="free">See all</button></div>
      <div class="rail" id="railFree"></div>

      <div class="sec reveal"><h2>Campuses</h2><span class="sub">5 universities</span></div>
      <div class="campuses reveal" id="campusRow"></div>
    </section>

    <section id="resultsView" hidden>
      <div class="results">
        <div class="head"><span class="count" id="resCount"></span><button class="clear" id="clearBtn">Clear all</button></div>
        <div class="rows" id="rows"></div>
        <div class="empty" id="emptyState" hidden><b>Nothing matches yet</b>Try another word, or clear the filters.</div>
      </div>
    </section>
  </main>

  <nav class="tabs" aria-label="Main">
    <button class="tab" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1v-9.5Z"/></svg>Home
    </button>
    <button class="tab" data-proto="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>Search
    </button>
    <button class="tab" data-proto="Saved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 4.5h12a1 1 0 0 1 1 1V21l-7-4.2L5 21V5.5a1 1 0 0 1 1-1Z"/></svg>Saved
    </button>
    <button class="tab" data-proto="Profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>Me
    </button>
  </nav>

  <div class="scrim" id="scrim"></div>

  <section class="sheet search" id="searchSheet" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
    <div class="grab"></div>
    <div class="head">
      <div class="steps"><i class="on" data-stepbar="1"></i><i data-stepbar="2"></i><i data-stepbar="3"></i></div>
      <button class="close" id="searchClose" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <h3 id="searchTitle">Where?</h3>
    <p class="sub" id="searchSub">Pick a campus, or search anywhere in Sydney.</p>
    <div id="searchExtra"></div>
    <div class="opts" id="searchOpts"></div>
    <div class="foot"><span class="count" id="searchCount"></span><button class="show" id="searchShow">Show events</button></div>
  </section>

  <section class="eventpage" id="eventPage" role="dialog" aria-modal="true" aria-labelledby="esTitle">
    <div class="ep-scroll" id="epScroll">
      <div class="ep-hero">
        <img id="esImg" alt="">
        <div class="ep-top">
          <button id="esBack" aria-label="Back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button id="esSave" aria-label="Save">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4.5h12a1 1 0 0 1 1 1V21l-7-4.2L5 21V5.5a1 1 0 0 1 1-1Z"/></svg>
          </button>
        </div>
      </div>
      <div class="ep-body">
        <div class="ep-cat" id="esCat"></div>
        <h1 id="esTitle"></h1>
        <div class="ep-host">
          <img id="esCrest" alt="">
          <div><b id="esSoc"></b><span id="esSocMeta"></span></div>
        </div>
        <div class="ep-meta">
          <div class="mrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
            <div><b id="esWhen"></b><span id="esWhenSub"></span></div>
          </div>
          <div class="mrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
            <div><b id="esWhere"></b><span id="esWhereSub"></span></div>
          </div>
        </div>
        <p class="ep-desc" id="esDesc"></p>
        <div class="ep-sec">Spots</div>
        <div class="ep-bar"><span id="esBar"></span></div>
        <div id="esSpots" class="meta" style="font-size:12px;color:var(--muted)"></div>
        <div class="ep-sec">Where</div>
        <div class="ep-map">
          <iframe id="esMap" title="Map" loading="lazy" referrerpolicy="no-referrer"></iframe>
          <div class="mapbtns">
            <a id="esGmaps" target="_blank" rel="noopener">Google directions</a>
            <a id="esApple" target="_blank" rel="noopener">Apple Maps</a>
          </div>
        </div>
      </div>
    </div>
    <div class="ep-cta">
      <div class="p"><b id="esPrice">—</b><span id="esSeats"></span></div>
      <button class="rsvp" id="esRsvp">RSVP</button>
    </div>
  </section>
</div>

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var money=function(n){n=Number(n)||0;return n===0?'Free':'$'+n;};
  var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDay(i){var d=new Date(i);return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()];}
  function fmtTime(i){return new Date(i).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit',hour12:true});}
  function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

  var CATS={outdoors:'Outdoors',social:'Social',creative:'Creative',sport:'Sport',careers:'Careers',other:'Other'};
  var ICON={
    pin:'<svg viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>',
    cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>',
    tag:'<svg viewBox="0 0 24 24"><path d="M20 12.5 12.5 20a2 2 0 0 1-2.8 0L4 14.3V4h10.3l5.7 5.7a2 2 0 0 1 0 2.8Z"/><circle cx="9" cy="9" r="1.4"/></svg>',
    ticket:'<svg viewBox="0 0 24 24"><path d="M3.5 9.5V7a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v2.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-2.5a2.5 2.5 0 0 0 0-5Z"/><path d="M13 8.5v7"/></svg>',
    globe:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M3.6 12h16.8M12 3.4c2.4 2.3 3.6 5.3 3.6 8.6S14.4 18.3 12 20.6c-2.4-2.3-3.6-5.3-3.6-8.6S9.6 5.7 12 3.4Z"/></svg>',
    spark:'<svg viewBox="0 0 24 24"><path d="M12 3.2l1.9 5.6 5.6 1.9-5.6 1.9L12 18.2l-1.9-5.6L4.5 10.7l5.6-1.9L12 3.2Z"/></svg>',
    free:'<svg viewBox="0 0 24 24"><path d="M4 12.5h16M4 8.5h16M8 4.5h8a3.5 3.5 0 0 1 0 7H8m0 0h8a3.5 3.5 0 0 1 0 7H8v-14"/></svg>',
    all:'<svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="3"/><circle cx="17" cy="7" r="3"/><circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3"/></svg>'
  };

  var S={events:[],campuses:[],anchors:{},q:'',where:'any',when:'any',date:'',what:'all',free:false,radius:0,saved:{},step:1,pending:{},heroIdx:0};

  async function api(p){var r=await fetch(p,{credentials:'include'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
  function haversine(a,b){if(!a||!b)return 999;var R=6371,t=function(x){return x*Math.PI/180;};
    var dLat=t(b[0]-a[0]),dLon=t(b[1]-a[1]);
    var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLon/2)*Math.sin(dLon/2);
    return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*10)/10;}
  function distOf(e){return haversine(S.anchors[e.campus_id],e.venue_coords);}

  async function load(){
    var d=await api('/api/events?when=all&limit=120');S.events=d.events||[];
    try{var c=await api('/api/campuses');S.campuses=c.campuses||[];}catch(e){}
    S.events.forEach(function(e){if(!S.anchors[e.campus_id]&&e.venue_coords)S.anchors[e.campus_id]=e.venue_coords;});
  }

  /* ---------- Hero：4 张图缓慢淡入淡出 ---------- */
  function renderHero(){
    var soon=S.events.slice().sort(function(a,b){return new Date(a.starts_at)-new Date(b.starts_at);}).slice(0,4);
    $('#slides').innerHTML=soon.map(function(e){
      return '<div class="slide" style="background-image:url(\''+esc(e.cover_image_url)+'\')"></div>';
    }).join('');
    renderHeroText(soon);
    if(soon.length>1){
      setInterval(function(){
        S.heroIdx=(S.heroIdx+1)%soon.length;
        renderHeroText(soon);
        $$('#heroDots i').forEach(function(d,i){d.classList.toggle('on',i===S.heroIdx);});
      },8000);
    }
  }
  function renderHeroText(list){
    var e=list[S.heroIdx%list.length]; if(!e) return;
    $('#heroKicker').textContent='Tonight on campus';
    $('#heroMeta').innerHTML='<b>'+esc(e.society_name)+'</b><span class="dot"></span><span>'+fmtDay(e.starts_at)+' · '+fmtTime(e.starts_at)+'</span><span class="dot"></span><span>'+esc(String(e.venue).split(',')[0])+'</span>';
  }

  /* ---------- 自然语言 ---------- */
  var SYN={outdoors:['hike','walk','outdoor','nature','coast','trail'],social:['party','picnic','trivia','games','food','meet'],creative:['art','clay','pottery','zine','sketch','photo','film'],sport:['run','football','volley','swim','yoga','gym'],careers:['intern','cv','career','portfolio','panel','job']};
  var WD={sunday:0,sun:0,monday:1,mon:1,tuesday:2,tue:2,wednesday:3,wed:3,thursday:4,thu:4,friday:5,fri:5,saturday:6,sat:6};
  function parse(q){
    var p={};
    if(/\b(free|no cost)\b/.test(q))p.free=true;
    if(/\btoday\b/.test(q))p.day='today';else if(/\btomorrow\b/.test(q))p.day='tomorrow';
    else{for(var k in WD){if(new RegExp('\\b'+k+'\\b').test(q)){p.weekday=WD[k];break;}}}
    if(/\bweekend\b/.test(q))p.weekend=true;
    if(/\bmorning\b/.test(q))p.hmax=12;else if(/\bafternoon\b/.test(q)){p.hmin=12;p.hmax=17;}else if(/\b(evening|night)\b/.test(q))p.hmin=17;
    var m=q.match(/(?:under|below|less than)\s*\$?\s*(\d+)/);if(m)p.max=Number(m[1]);
    return p;
  }
  function matches(e){
    var q=S.q.trim().toLowerCase(),now=new Date(),d=new Date(e.starts_at);
    if(S.where!=='any'&&e.campus_id!==S.where)return false;
    if(S.what!=='all'&&e.category!==S.what)return false;
    if(S.free&&e.price_public>0)return false;
    if(S.radius>0&&S.where!=='any'&&distOf(e)>S.radius)return false;
    if(S.date&&!sameDay(d,new Date(S.date)))return false;
    if(S.when==='today'&&!sameDay(d,now))return false;
    if(S.when==='tomorrow'){var tm=new Date(now.getTime()+86400000);if(!sameDay(d,tm))return false;}
    if(S.when==='weekend'&&d.getDay()!==0&&d.getDay()!==6)return false;
    if(S.when==='7d'&&d.getTime()>now.getTime()+7*86400000)return false;
    if(!q)return true;
    var P=parse(q);
    if(P.free&&e.price_public>0)return false;
    if(P.max!=null&&e.price_public>P.max)return false;
    if(P.day==='today'&&!sameDay(d,now))return false;
    if(P.day==='tomorrow'){var t2=new Date(now.getTime()+86400000);if(!sameDay(d,t2))return false;}
    if(P.weekday!=null&&d.getDay()!==P.weekday)return false;
    if(P.weekend&&d.getDay()!==0&&d.getDay()!==6)return false;
    if(P.hmax!=null&&d.getHours()>=P.hmax)return false;
    if(P.hmin!=null&&d.getHours()<P.hmin)return false;
    var hay=(e.title+' '+e.society_name+' '+e.venue+' '+e.category+' '+(e.description||'')).toLowerCase();
    if(hay.indexOf(q)>-1)return true;
    for(var k in SYN){if((q.indexOf(k)>-1||SYN[k].some(function(w){return q.indexOf(w)>-1;}))&&e.category===k)return true;}
    var rest=q.replace(/\b(free|today|tomorrow|weekend|monday|tuesday|wednesday|thursday|friday|saturday|sunday|mon|tue|wed|thu|fri|sat|sun|morning|afternoon|evening|night|under|below|less|than|cheap|budget|\d+|\$)\b/g,'').trim();
    return !rest;
  }
  function isFiltering(){return !!(S.q.trim()||S.where!=='any'||S.when!=='any'||S.date||S.what!=='all'||S.free||S.radius>0);}

  /* ---------- 卡片 ---------- */
  function seatsTag(e){
    if(e.seats_left==null)return '';
    if(e.seats_left===0)return '<span class="seats low">Full</span>';
    return '<span class="seats'+(e.seats_left<=5?' low':'')+'">'+e.seats_left+' left</span>';
  }
  function cardHTML(e){
    var d=new Date(e.starts_at);
    return '<button class="card" data-id="'+esc(e.id)+'" aria-label="Open '+esc(e.title)+'">'+
      '<div class="thumb"><img src="'+esc(e.cover_image_url)+'" alt="" loading="lazy">'+
      '<span class="date">'+MONTHS[d.getMonth()].toUpperCase()+' '+d.getDate()+'</span>'+
      '<span class="chipcat">'+esc(CATS[e.category]||'Event')+'</span>'+
      '<span class="save" data-save="'+esc(e.id)+'" role="button" aria-label="Save" aria-pressed="'+(!!S.saved[e.id])+'">'+
        '<svg viewBox="0 0 24 24" fill="'+(S.saved[e.id]?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 4.5h12a1 1 0 0 1 1 1V21l-7-4.2L5 21V5.5a1 1 0 0 1 1-1Z"/></svg></span></div>'+
      '<div class="body"><div class="title">'+esc(e.title)+'</div>'+
      '<div class="meta">'+ICON.cal+' '+fmtDay(e.starts_at)+' · '+fmtTime(e.starts_at)+' · '+esc(String(e.venue).split(',')[0])+'</div>'+
      '<div class="foot"><span class="price">'+money(e.your_price)+'</span>'+seatsTag(e)+'</div></div></button>';
  }
  function rowHTML(e){
    return '<button class="row" data-id="'+esc(e.id)+'">'+
      '<span class="rhumb"><img src="'+esc(e.cover_image_url)+'" alt="" loading="lazy"></span>'+
      '<span class="rmain"><div class="rtitle">'+esc(e.title)+'</div>'+
      '<div class="rmeta">'+fmtDay(e.starts_at)+' · '+fmtTime(e.starts_at)+' · '+esc(String(e.venue).split(',')[0])+'</div>'+
      '<div class="rfoot"><span class="rprice">'+money(e.your_price)+'</span>'+seatsTag(e)+
      '<span class="rtag">'+esc(e.society_name)+'</span></div></span></button>';
  }
  function renderRails(){
    var soon=S.events.slice().sort(function(a,b){return new Date(a.starts_at)-new Date(b.starts_at);});
    var free=S.events.filter(function(e){return e.price_public===0;});
    $('#railSoon').innerHTML=soon.slice(0,12).map(cardHTML).join('');
    $('#railFree').innerHTML=(free.length?free:soon.slice().reverse()).slice(0,12).map(cardHTML).join('');
  }
  function renderCampuses(){
    $('#campusRow').innerHTML=S.campuses.map(function(c){
      return '<button class="campus" data-campus="'+esc(c.id)+'"><img src="'+esc(c.logo)+'" alt=""><span>'+esc(c.short)+'</span></button>';
    }).join('');
  }
  function render(){
    var filtering=isFiltering();
    $('#homeView').hidden=filtering;$('#resultsView').hidden=!filtering;
    var whenLabel=S.date?fmtDay(S.date):({any:'Any day',today:'Today',tomorrow:'Tomorrow',weekend:'This weekend','7d':'7 days'}[S.when]||'Any day');
    $('#pillWhen').textContent=whenLabel;$('#valWhen').textContent=whenLabel;
    $('#pillWhat').textContent=S.what==='all'?'Any type':(CATS[S.what]||'Any type');
    $('#valWhat').textContent=S.what==='all'?'Anything':(CATS[S.what]||'Anything');
    $('#valWhere').textContent=S.where==='any'?'Anywhere':((S.campuses.filter(function(c){return c.id===S.where;})[0]||{}).short||'Anywhere');
    $('#pillRadius').textContent=S.radius?S.radius+' km':'3 km';
    $$('#filterRow .filter').forEach(function(b){
      var k=b.dataset.pill;
      b.dataset.active=String((k==='when'&&(S.when!=='any'||!!S.date))||(k==='what'&&S.what!=='all')||(k==='free'&&S.free)||(k==='radius'&&S.radius>0));
    });
    if(!filtering)return;
    var list=S.events.filter(matches).sort(function(a,b){return new Date(a.starts_at)-new Date(b.starts_at);});
    $('#resCount').textContent=list.length+' result'+(list.length===1?'':'s');
    $('#rows').innerHTML=list.map(rowHTML).join('');
    $('#emptyState').hidden=list.length>0;
  }

  /* ---------- 分步面板 ---------- */
  function previewCount(){var save={where:S.where,when:S.when,what:S.what,free:S.free,q:S.q,date:S.date};
    Object.assign(S,S.pending);var n=S.events.filter(matches).length;Object.assign(S,save);return n;}
  function dateCount(dstr){return S.events.filter(function(e){return sameDay(new Date(e.starts_at),new Date(dstr));}).length;}
  function renderStep(){
    var st=S.step;
    $$('#searchSheet [data-stepbar]').forEach(function(i){i.classList.toggle('on',Number(i.dataset.stepbar)<=st);});
    $('#searchExtra').innerHTML='';
    if(st===1){
      $('#searchTitle').textContent='Where?';$('#searchSub').textContent='Pick a campus, or search anywhere in Sydney.';
      $('#searchExtra').innerHTML='<div class="searchfield">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>'+
        '<input id="qInput" placeholder="Search events, societies, venues" value="'+esc(S.pending.q||'')+'"></div>'+
        '<div class="popular"><span class="lbl">Popular</span>'+
        ['careers','walk','coffee','hike'].map(function(t){return '<button data-pop="'+t+'">'+t+'</button>';}).join('')+'</div>';
      var CC={mq_sydney:'#1F4A3B',usyd_camperdown:'#D8583A',unsw_kensington:'#2E5E8C',uts_haymarket:'#B4622E',wsu_parramatta:'#7A3E6B'};
      var opts=[{k:'any',t:'Anywhere',d:'All of Sydney',short:'ALL',c:'linear-gradient(135deg,#1F4A3B,#D8583A)'}]
        .concat(S.campuses.map(function(c){return {k:c.id,t:c.name,d:c.short+' campus',short:c.short,c:CC[c.id]||'#1F4A3B'};}));
      $('#searchOpts').innerHTML=opts.map(function(x){
        var on=(S.pending.where||'any')===x.k;
        var cnt=S.events.filter(function(e){return x.k==='any'||e.campus_id===x.k;}).length;
        var ic='<span class="badge" style="background:'+x.c+'">'+esc(x.short)+'</span>';
        return '<button class="opt" data-opt="where" data-k="'+esc(x.k)+'" aria-pressed="'+on+'">'+ic+'<span><span class="t">'+esc(x.t)+'</span><span class="d">'+esc(x.d)+'</span></span><span class="cnt">'+cnt+'</span><span class="tick"></span></button>';
      }).join('');
    } else if(st===2){
      $('#searchTitle').textContent='When?';$('#searchSub').textContent='Pick a window — or a specific day.';
      var now=new Date();
      var ws=[['any','Any day','No date filter'],['today','Today','Before midnight'],['tomorrow','Tomorrow','The next day'],['weekend','This weekend','Sat & Sun'],['7d','Next 7 days','Rolling week']];
      $('#searchOpts').innerHTML=ws.map(function(x){
        var on=(S.pending.when||'any')===x[0]&&!S.pending.date;
        var cnt=S.events.filter(function(e){
          var d=new Date(e.starts_at);
          if(x[0]==='any')return true;
          if(x[0]==='today')return sameDay(d,now);
          if(x[0]==='tomorrow')return sameDay(d,new Date(now.getTime()+86400000));
          if(x[0]==='weekend')return d.getDay()===0||d.getDay()===6;
          if(x[0]==='7d')return d.getTime()<=now.getTime()+7*86400000;
          return true;
        }).length;
        return '<button class="opt" data-opt="when" data-k="'+x[0]+'" aria-pressed="'+on+'"><span><span class="t">'+x[1]+'</span><span class="d">'+x[2]+'</span></span><span class="cnt">'+cnt+'</span><span class="tick"></span></button>';
      }).join('')+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px"><span style="font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Pick a day</span></div>'+
      '<div class="datestrip" id="dateStrip">'+dateChips()+'</div>';
    } else {
      $('#searchTitle').textContent='What?';$('#searchSub').textContent='Pick a type, or keep it open.';
      var COL={outdoors:'#1F4A3B',social:'#D8583A',creative:'#B4622E',sport:'#2E5E8C',careers:'#7A3E6B',other:'#6B7280'};
      var ws2=[['all','Anything','All event types']].concat(Object.keys(CATS).map(function(k){return [k,CATS[k],''];}));
      $('#searchOpts').innerHTML=ws2.map(function(x){
        var on=(S.pending.what||'all')===x[0];
        var cnt=S.events.filter(function(e){return x[0]==='all'||e.category===x[0];}).length;
        var dot=x[0]==='all'?'<span class="dot" style="background:linear-gradient(135deg,#1F4A3B,#D8583A)"></span>':'<span class="dot" style="background:'+COL[x[0]]+'"></span>';
        return '<button class="opt" data-opt="what" data-k="'+x[0]+'" aria-pressed="'+on+'">'+dot+'<span><span class="t">'+x[1]+'</span>'+(x[2]?'<span class="d">'+x[2]+'</span>':'')+'</span><span class="cnt">'+cnt+'</span><span class="tick"></span></button>';
      }).join('')+
      '<button class="opt" data-opt="free" data-k="1" aria-pressed="'+(!!S.pending.free)+'"><span class="dot" style="background:#E9EFE8;border:1px solid #C9D6CC"></span><span><span class="t">Free only</span><span class="d">No ticket price</span></span><span class="cnt">'+S.events.filter(function(e){return e.price_public===0;}).length+'</span><span class="tick"></span></button>';
    }
    var n=previewCount();
    $('#searchCount').textContent=n+(n===1?' event matches':' events match');
    $('#searchShow').textContent=st<3?'Next':'Show events';
  }
  function dateChips(){
    var out='',today=new Date();
    for(var i=0;i<21;i++){
      var d=new Date(today.getTime()+i*86400000),cnt=dateCount(d),key=d.toISOString().slice(0,10);
      var on=S.pending.date===key;
      out+='<button class="dchip'+(cnt?'':' none')+'" data-date="'+key+'" aria-pressed="'+on+'"><span class="dn">'+DAYS[d.getDay()]+'</span><span class="dd">'+d.getDate()+'</span><span class="ev">'+(cnt?cnt+' ev':'—')+'</span></button>';
    }
    return out;
  }
  function openSearch(step){
    S.step=step||1;S.pending={where:S.where,when:S.when,what:S.what,free:S.free,q:S.q,date:S.date};
    renderStep();$('#scrim').classList.add('on');$('#searchSheet').classList.add('on');
  }
  function closeSearch(){$('#scrim').classList.remove('on');$('#searchSheet').classList.remove('on');}
  function applySearch(){
    S.where=S.pending.where;S.when=S.pending.when;S.what=S.pending.what;S.free=!!S.pending.free;S.q=S.pending.q||'';S.date=S.pending.date||'';
    closeSearch();render();
    if(isFiltering())$('#scroll').scrollTo({top:Math.max(0,$('#homeView').offsetTop-8),behavior:'smooth'});
  }

  /* ---------- 详情 ---------- */
  function openEvent(id){
    var e=S.events.filter(function(x){return x.id===id;})[0];if(!e)return;
    $('#esImg').src=e.cover_image_url;$('#esImg').alt=e.title;
    $('#esCat').textContent=(CATS[e.category]||'Event').toUpperCase();
    $('#esTitle').textContent=e.title;
    $('#esCrest').src=e.society_logo||'';
    $('#esSoc').textContent=e.society_name;
    $('#esSocMeta').textContent=(e.society_rating?('★ '+e.society_rating+' · '):'')+(e.campus_name||'');
    $('#esWhen').textContent=fmtDay(e.starts_at)+' · '+fmtTime(e.starts_at);
    $('#esWhenSub').textContent=(new Date(e.ends_at)-new Date(e.starts_at))/3600000+' hours · '+(e.audience_scope==='CAMPUS_ONLY'?'Own campus only':'Open to all campuses');
    $('#esWhere').textContent=String(e.venue).split(',')[0];
    $('#esWhereSub').textContent=(e.venue_coords?e.venue_coords[0].toFixed(4)+', '+e.venue_coords[1].toFixed(4):'');
    $('#esDesc').textContent=e.description;
    var pct=e.capacity?Math.min(100,Math.round(e.rsvp_count/e.capacity*100)):0;
    $('#esBar').style.width=pct+'%';
    $('#esSpots').textContent=e.rsvp_count+' going'+(e.capacity?(' · '+Math.max(0,e.capacity-e.rsvp_count)+' of '+e.capacity+' spots left'):'');
    $('#esPrice').textContent=money(e.your_price);
    var seats=$('#esSeats');
    if(e.seats_left==null){seats.textContent='No cap';seats.className='';}
    else if(e.seats_left===0){seats.textContent='Full';seats.className='low';}
    else {seats.textContent=e.seats_left+' left';seats.className=e.seats_left<=5?'low':'';}
    var btn=$('#esRsvp');
    if(e.my_rsvp){btn.textContent="You're in";btn.disabled=true;}
    else if(e.seats_left===0){btn.textContent='Full';btn.disabled=true;}
    else {btn.textContent='RSVP'+(e.your_price?' · '+money(e.your_price):' free');btn.disabled=false;}
    if(e.map){$('#esMap').src=e.map.osm_embed;$('#esGmaps').href=e.map.google_directions;$('#esApple').href=e.map.apple_maps;}
    $('#esSave').setAttribute('aria-pressed',String(!!S.saved[e.id]));
    $('#esSave').querySelector('svg').setAttribute('fill',S.saved[e.id]?'currentColor':'none');
    $('#epScroll').scrollTop=0;
    $('#eventPage').classList.add('on');
    S.openEventId=e.id;
  }
  function closeEvent(){$('#eventPage').classList.remove('on');S.openEventId=null;}

  /* ---------- 事件 ---------- */
  document.addEventListener('click',function(ev){
    var save=ev.target.closest('[data-save]');
    if(save){ev.stopPropagation();var id=save.dataset.save;S.saved[id]=!S.saved[id];
      save.setAttribute('aria-pressed',String(!!S.saved[id]));save.querySelector('svg').setAttribute('fill',S.saved[id]?'currentColor':'none');return;}
    var card=ev.target.closest('[data-id]');if(card){openEvent(card.dataset.id);return;}
    var pop=ev.target.closest('[data-pop]');
    if(pop){S.pending.q=pop.dataset.pop;renderStep();return;}
    var opt=ev.target.closest('[data-opt]');
    if(opt){var kind=opt.dataset.opt,k=opt.dataset.k;
      if(kind==='free')S.pending.free=!S.pending.free;else if(kind==='when'){S.pending.when=k;S.pending.date='';}else S.pending[kind]=k;
      renderStep();return;}
    var dc=ev.target.closest('[data-date]');
    if(dc){S.pending.date=(S.pending.date===dc.dataset.date?'':dc.dataset.date);if(S.pending.date)S.pending.when='any';renderStep();return;}
    var pill=ev.target.closest('[data-pill]');
    if(pill){var p=pill.dataset.pill;
      if(p==='free'){S.free=!S.free;render();return;}
      if(p==='when'){openSearch(2);return;}
      if(p==='what'){openSearch(3);return;}
      if(p==='radius'){S.radius=S.radius===0?3:(S.radius===3?5:0);if(S.radius&&S.where==='any'&&S.campuses[0])S.where=S.campuses[0].id;render();return;}
      return;}
    var camp=ev.target.closest('[data-campus]');
    if(camp){S.where=camp.dataset.campus;S.when='any';S.date='';S.what='all';S.free=false;S.radius=0;render();return;}
    var see=ev.target.closest('[data-see]');if(see){toast('See all — next screen');return;}
    var proto=ev.target.closest('[data-proto]');if(proto){toast(proto.dataset.proto+' — next screen');return;}
    if(ev.target.id==='scrim'){closeSearch();}
  });
  document.addEventListener('input',function(ev){
    if(ev.target.id==='qInput'){S.pending.q=ev.target.value;var n=previewCount();
      $('#searchCount').textContent=n+(n===1?' event matches':' events match');}
  });
  $('#segWhere').onclick=function(){openSearch(1);};
  $('#segWhen').onclick=function(){openSearch(2);};
  $('#segWhat').onclick=function(){openSearch(3);};
  $('#searchGo').onclick=function(){openSearch(1);};
  $('#searchClose').onclick=closeSearch;
  $('#searchShow').onclick=function(){if(S.step<3){S.step++;renderStep();}else applySearch();};
  $('#esBack').onclick=closeEvent;
  $('#esSave').onclick=function(){
    var id=S.openEventId;if(!id)return;
    S.saved[id]=!S.saved[id];
    this.setAttribute('aria-pressed',String(!!S.saved[id]));
    this.querySelector('svg').setAttribute('fill',S.saved[id]?'currentColor':'none');
  };
  $('#esRsvp').onclick=function(){
    var id=S.openEventId;if(!id)return;
    var e=S.events.filter(function(x){return x.id===id;})[0];
    toast('RSVP flow — next build'); 
  };
  $('#clearBtn').onclick=function(){S.q='';S.where='any';S.when='any';S.date='';S.what='all';S.free=false;S.radius=0;render();};
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeSearch();closeEvent();}});

  var toastEl=document.createElement('div');
  toastEl.style.cssText='position:absolute;left:50%;bottom:86px;transform:translate(-50%,10px);background:rgba(14,26,21,.94);color:#fff;padding:9px 14px;border-radius:10px;font-size:12.5px;opacity:0;transition:.2s;z-index:30;pointer-events:none;white-space:nowrap';
  $('#app').appendChild(toastEl);var tt;
  function toast(m){toastEl.textContent=m;toastEl.style.opacity='1';toastEl.style.transform='translate(-50%,0)';clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity='0';toastEl.style.transform='translate(-50%,10px)';},1600);}

  /* 入场动画 */
  function observeReveals(){
    if(!('IntersectionObserver' in window)){$$('.reveal').forEach(function(e){e.classList.add('in');});return;}
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});
    },{root:$('#scroll'),threshold:.12});
    $$('.reveal').forEach(function(e){io.observe(e);});
  }

  (async function boot(){
    try{await load();}catch(e){$('#rows').innerHTML='<div class="empty"><b>Could not load events</b>'+esc(e.message)+'</div>';}
    renderHero();renderRails();renderCampuses();render();observeReveals();
  })();
})();
</script>
</body>
</html>
